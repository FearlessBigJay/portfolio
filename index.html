<!doctype html>
<html lang="en" data-theme="dark" data-palette="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page-specific title, description, canonical, Open Graph, Twitter and JSON-LD
         are injected here at build time by scripts/prerender.js (see src/seo.js). -->
    <!--app-head-->
    <meta name="author" content="BigJay (Jah'swill Uchechi Emmanuel)" />
    <meta name="application-name" content="BigJay" />
    <meta name="apple-mobile-web-app-title" content="BigJay" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="me" href="https://github.com/FearlessBigJay" />
    <link rel="me" href="https://linkedin.com/in/fearlessbigjay" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
    />

    <!-- Apply saved display settings before first paint to avoid a flash. -->
    <script>
      try {
        var d = document.documentElement;
        var get = function (k) {
          try { return localStorage.getItem("portfolio-" + k); } catch (e) { return null; }
        };
        // Theme id -> light/dark scheme. Keep in sync with src/data/themes.js.
        var schemes = { dark: "dark", light: "light", forest: "dark", ocean: "dark", dusk: "dark", sepia: "light" };
        var t = get("theme");
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (schemes[t]) {
          d.setAttribute("data-theme", schemes[t]);
          d.setAttribute("data-palette", t);
        }
        var s = get("textSize");
        if (s) d.setAttribute("data-text", s);
        if (get("highContrast") === "true") d.setAttribute("data-contrast", "high");
        if (get("underlineLinks") === "true") d.classList.add("underline-links");
        if (get("readableFont") === "true") d.classList.add("readable-font");
        var reduce = get("reducedMotion") === "true" || matchMedia("(prefers-reduced-motion: reduce)").matches;
        d.classList.add(reduce ? "reduced-motion" : "motion-ok");
        // Page-to-page transitions are CSS-driven; also honour the in-page "Reduce motion" setting.
        var skip = function (e) {
          if (d.classList.contains("reduced-motion") && e.viewTransition) e.viewTransition.skipTransition();
        };
        addEventListener("pageswap", skip);
        addEventListener("pagereveal", skip);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
